name: App RBM TV (APK)
on:
  push:
    paths: ['_tv-app/**', '.github/workflows/tv-apk.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar el APK
        working-directory: _tv-app
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rbm-tv
          path: _tv-app/app/build/outputs/apk/release/app-release.apk
