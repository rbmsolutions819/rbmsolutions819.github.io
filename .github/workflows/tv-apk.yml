name: App RBM TV (APK)
on:
  push:
    paths: ['_tv-app/**', '.github/workflows/tv-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar el APK
        working-directory: _tv-app
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rbm-tv
          path: _tv-app/app/build/outputs/apk/release/app-release.apk
      - name: Publicar el APK en rbmsolutionscr.com/tv/rbm-tv.apk
        run: |
          cp _tv-app/app/build/outputs/apk/release/app-release.apk tv/rbm-tv.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv/rbm-tv.apk
          git commit -m "RBM TV: APK nuevo" || exit 0
          git pull --rebase
          git push
