<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>RBM TV</title>
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
/* Todo se mide con el ancho de la pantalla (1rem = 1 % del ancho): se ve igual en un televisor de 32" o de 75" */
:root{--fondo:#04070f;--panel:rgba(255,255,255,.06);--linea:rgba(255,255,255,.12);--texto:#f2f5fc;--suave:#9aa6c2;--azul:#3b82f6;--celeste:#7cc0ff;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:calc(100vw / 96)}
body{margin:0;height:100vh;overflow:hidden;background:var(--fondo);color:var(--texto);font:400 1.5rem/1.4 "Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
[hidden]{display:none!important}

/* fondo vivo: luces que se mueven despacio */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:60vw;height:60vw;border-radius:50%;filter:blur(9vw);opacity:.55;transition:background 1.2s}
.aurora i:nth-child(1){left:-15vw;top:-25vw;background:var(--c1,#1d4ed8);animation:flota1 26s ease-in-out infinite}
.aurora i:nth-child(2){right:-20vw;top:-10vw;background:var(--c2,#7c3aed);animation:flota2 32s ease-in-out infinite;opacity:.4}
.aurora i:nth-child(3){left:30vw;bottom:-40vw;background:#0ea5e9;opacity:.18;animation:flota1 40s ease-in-out infinite reverse}
@keyframes flota1{50%{transform:translate(8vw,6vw) scale(1.1)}}
@keyframes flota2{50%{transform:translate(-10vw,8vw) scale(.9)}}
.grano{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(4,7,15,.2),rgba(4,7,15,.75) 55%,var(--fondo) 80%)}

/* barra de arriba */
.barra{position:relative;z-index:3;display:flex;align-items:center;gap:1.4rem;padding:2.2rem 4rem 0}
.barra img{width:3.8rem;height:3.8rem;border-radius:1rem;box-shadow:0 0 0 .1rem rgba(255,255,255,.25),0 .8rem 2rem -.6rem rgba(59,130,246,.8)}
.barra b{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.barra b small{display:block;font-size:1.05rem;font-weight:600;color:var(--suave);letter-spacing:.18em;text-transform:uppercase;margin-top:.1rem}
.hora{margin-left:auto;text-align:right}
.hora b{display:block;font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.hora span{font-size:1.15rem;color:var(--suave)}

/* portada: lo que está seleccionado, con vista previa en vivo */
.hero{position:relative;z-index:2;height:47vh;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3rem;align-items:center;padding:1.2rem 4rem 1.6rem}
.info{min-width:0;max-height:100%;overflow:hidden}
.ceja{display:inline-flex;align-items:center;gap:.8rem;font-size:1.15rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--celeste)}
.ceja::before{content:"";width:2.4rem;height:.15rem;background:currentColor}
.hero h1{margin:.8rem 0 0;font-size:4.6rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:900;letter-spacing:-.04em;line-height:.98;max-width:52rem}
.hero p{margin:1rem 0 0;color:#c6cfe3;font-size:1.5rem;line-height:1.45;max-width:50rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:.8rem;margin-top:1.4rem;flex-wrap:nowrap;overflow:hidden}
.chips span{white-space:nowrap}
.chips span{font-size:1.15rem;font-weight:600;padding:.5rem 1.2rem;border-radius:99rem;background:var(--panel);border:.1rem solid var(--linea)}
.chips .ok{background:#fff;color:#04070f;border-color:#fff}
.info>*{transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1)}
.info.cambia>*{opacity:0;transform:translateY(1.2rem)}
.vista{position:relative;height:100%;aspect-ratio:16/10;justify-self:end;border-radius:1.6rem;overflow:hidden;background:#0b1224;box-shadow:0 3rem 7rem -2rem rgba(0,0,0,.85),0 0 0 .12rem rgba(255,255,255,.14)}
.vista .cromo{position:absolute;inset:0 0 auto;height:2.4rem;display:flex;align-items:center;gap:.5rem;padding:0 1rem;background:rgba(15,22,42,.95);z-index:2;font-size:1rem;color:var(--suave)}
.vista .cromo i{width:.8rem;height:.8rem;border-radius:50%;background:#ef4444}.vista .cromo i:nth-child(2){background:#f59e0b}.vista .cromo i:nth-child(3){background:#22c55e}
.vista .cromo span{margin-left:1rem;padding:.2rem 1rem;border-radius:99rem;background:rgba(255,255,255,.06);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vista .marco{position:absolute;left:0;right:0;top:2.4rem;bottom:0;overflow:hidden}
.vista iframe{position:absolute;left:0;top:0;width:1280px;height:800px;border:0;transform-origin:0 0;pointer-events:none;opacity:0;transition:opacity .6s}
.vista iframe.lista{opacity:1}
.vista .arte svg{width:8rem;height:8rem;opacity:.9}
.vista .arte{position:absolute;inset:2.4rem 0 0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,var(--c1),transparent 70%),linear-gradient(140deg,var(--c1),var(--c2));font-size:9rem;transition:opacity .5s}
.vista .arte.fuera{opacity:0}
.vista .vivo{position:absolute;right:1rem;bottom:1rem;z-index:3;font-size:.95rem;font-weight:800;letter-spacing:.14em;padding:.35rem .9rem;border-radius:99rem;background:rgba(4,7,15,.75);color:#86efac;display:flex;align-items:center;gap:.5rem}
.vista .vivo::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:#22c55e;animation:late 1.5s infinite}
@keyframes late{50%{opacity:.3}}

/* filas tipo Netflix */
.filas{position:relative;z-index:2;height:calc(100vh - 47vh - 6.2rem);overflow:hidden;padding:0 0 4rem}
.filas-in{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.fila{margin-bottom:2.4rem}
.fila h2{margin:0 4rem 1rem;font-size:1.35rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--suave);transition:color .3s}
.fila.activa h2{color:#fff}
.carril{display:flex;gap:1.4rem;padding:1.2rem 4rem 1.6rem;overflow:hidden;scroll-behavior:smooth}
.t{position:relative;flex:none;width:21rem;aspect-ratio:16/9;border-radius:1.3rem;overflow:hidden;text-align:left;outline:none;background:linear-gradient(140deg,var(--c1),var(--c2));box-shadow:0 1rem 2.4rem -1rem rgba(0,0,0,.8);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.t::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.22),transparent 55%),linear-gradient(180deg,transparent 35%,rgba(0,0,0,.55))}
.t .ic{position:absolute;right:1.3rem;top:1.2rem;width:3.4rem;height:3.4rem;opacity:.92;filter:drop-shadow(0 .4rem .8rem rgba(0,0,0,.35));transition:transform .3s,opacity .3s}
.t .ic svg,.vista .arte svg{width:100%;height:100%;fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.t:focus .ic{opacity:1}
.t b{position:absolute;left:1.3rem;right:1.3rem;bottom:1.1rem;font-size:1.55rem;font-weight:800;letter-spacing:-.01em;line-height:1.15;text-shadow:0 .2rem .8rem rgba(0,0,0,.5);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t em{position:absolute;left:1.1rem;top:1rem;font-style:normal;font-size:.95rem;font-weight:800;letter-spacing:.06em;padding:.3rem .8rem;border-radius:99rem;background:rgba(0,0,0,.35);backdrop-filter:blur(.4rem)}
.t:focus{transform:scale(1.1);z-index:5;box-shadow:0 0 0 .3rem #fff,0 2rem 4rem -1rem rgba(0,0,0,.9),0 0 4rem -.4rem var(--c1)}
.t:focus .ic{transform:scale(1.12)}
.t:focus::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%);animation:brillo 2.2s ease-in-out infinite}
@keyframes brillo{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
.t.grande{width:24rem}

/* pie con la ayuda del control */
.pie{position:fixed;z-index:4;left:0;right:0;bottom:0;display:flex;gap:2.4rem;justify-content:center;padding:1rem;font-size:1.1rem;color:var(--suave);background:linear-gradient(transparent,rgba(4,7,15,.95) 45%)}
.pie b{color:var(--texto);border:.1rem solid var(--linea);border-radius:.5rem;padding:.05rem .6rem;margin-right:.5rem;font-weight:700}

/* entrada con la marca */
.intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#10204a,#04070f 65%);transition:opacity .7s,visibility .7s}
.intro.fuera{opacity:0;visibility:hidden}
.intro div{display:grid;justify-items:center;gap:1.6rem}
.intro img{width:13rem;height:13rem;border-radius:3.2rem;animation:logo 1.2s cubic-bezier(.2,1.3,.4,1) both;box-shadow:0 0 0 .15rem rgba(255,255,255,.2),0 0 8rem rgba(59,130,246,.7)}
.intro b{font-size:4rem;font-weight:900;letter-spacing:-.03em;animation:sube .8s .35s both}
.intro span{font-size:1.4rem;letter-spacing:.4em;text-transform:uppercase;color:var(--celeste);animation:sube .8s .55s both}
.intro i{width:22rem;height:.3rem;border-radius:99rem;background:rgba(255,255,255,.1);overflow:hidden;animation:sube .6s .7s both}
.intro i::after{content:"";display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,#7cc0ff,transparent);animation:carga 1.1s ease-in-out infinite}
@keyframes logo{from{opacity:0;transform:scale(.5) rotate(-10deg);filter:blur(1rem)}}
@keyframes sube{from{opacity:0;transform:translateY(1.4rem)}}
@keyframes carga{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
</style>
</head>
<body data-propio>
<div class="intro" id="intro"><div><img src="/icon-512.png" alt=""><b>RBM Solutions</b><span>Páginas y demos</span><i></i></div></div>
<div class="aurora" id="aurora"><i></i><i></i><i></i></div><div class="grano"></div>

<header class="barra"><img src="/icon-192.png" alt=""><b>RBM Solutions<small>RBM TV</small></b><div class="hora"><b id="hora">--:--</b><span id="fecha"></span></div></header>

<section class="hero">
  <div class="info" id="info"><span class="ceja" id="hCeja">Inicio</span><h1 id="hT">RBM Solutions</h1><p id="hD"></p><div class="chips" id="hC"></div></div>
  <div class="vista" id="vista"><div class="cromo"><i></i><i></i><i></i><span id="vUrl">rbmsolutionscr.com</span></div><div class="marco" id="marco"></div><div class="arte" id="vArte"></div><div class="vivo">VISTA EN VIVO</div></div>
</section>

<div class="filas" id="filas"><div class="filas-in" id="filasIn"></div></div>

<div class="pie"><span><b>◀ ▲ ▼ ▶</b>Moverse</span><span><b>OK</b>Abrir</span><span><b>Atrás</b>Volver</span><span><b>Mantener OK</b>Puntero / flechas</span></div>

<script src="tv.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"], MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","setiembre","octubre","noviembre","diciembre"];
function reloj(){ const d = new Date(); let h = d.getHours(); const pm = h >= 12; h = h % 12 || 12;
  $("#hora").textContent = `${h}:${String(d.getMinutes()).padStart(2, "0")} ${pm ? "p. m." : "a. m."}`; $("#fecha").textContent = `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; }
reloj(); setInterval(reloj, 10000);

// entrada con la marca: solo al abrir la app, no al volver de una demo
let vino = false; try { vino = sessionStorage.getItem("tv-intro") === "1"; sessionStorage.setItem("tv-intro", "1"); } catch {}
if (vino) $("#intro").remove(); else setTimeout(() => { $("#intro").classList.add("fuera"); setTimeout(() => $("#intro")?.remove(), 800); }, 1900);

const COLORES = [["#2563eb","#0b1f5c"],["#7c3aed","#2e1065"],["#db2777","#500724"],["#059669","#022c22"],["#ea580c","#431407"],["#0891b2","#083344"],["#dc2626","#450a0a"],["#4f46e5","#1e1b4b"],["#ca8a04","#422006"],["#0d9488","#042f2e"]];
const SVG = {web:`<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>`,lock:`<rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.3"/>`,chart:`<path d="M3.5 20.5h17"/><path d="M5.5 16l4.5-5 3.5 3 6-7"/><path d="M15.5 7h4v4"/>`,crown:`<path d="M3.5 8l4 4 4.5-6.5L16.5 12l4-4-1.8 10.5H5.3z"/><path d="M5.5 21h13"/>`,edificio:`<path d="M3.5 20.5h17M5.5 20.5V9l6.5-5 6.5 5v11.5"/><path d="M9.5 20.5v-5h5v5M9 11h.01M15 11h.01"/>`,avion:`<path d="M10.5 13.5L3 11l1.5-1.5 8 1 4.5-4.5c1-1 2.6-1.3 3.3-.6s.4 2.3-.6 3.3L15.2 13.2l1 8L14.7 22.7 12.2 15.2 9 18.4v2.6l-1.5 1.5-1-3.5-3.5-1 1.5-1.5h2.6z"/>`,palillos:`<path d="M4 20L18 4M8 20L20 7"/><path d="M3.5 14.5h17a8.5 8.5 0 0 1-17 0z" transform="translate(0 -1)"/>`,taza:`<path d="M4.5 9h12v5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M16.5 10.5h1.5a2.5 2.5 0 0 1 0 5h-1.6M8 3.5c-.8 1 .8 2 0 3M12 3.5c-.8 1 .8 2 0 3"/>`,copa:`<path d="M5 4h14l-7 8z"/><path d="M12 12v8M8 20h8"/>`,hoja:`<path d="M5 19c0-8 5-14 15-15-1 10-7 15-15 15z"/><path d="M5 19c3-4 6-7 10-10"/>`,llama:`<path d="M12 3c3 4 6 6.5 6 11a6 6 0 0 1-12 0c0-3 2-4.5 2.5-7 1.5 1 2 2.5 2 3.5 1.5-2 1.5-5 1.5-7.5z"/>`,frasco:`<rect x="6" y="9" width="12" height="12" rx="3"/><path d="M9.5 9V5.5h5V9M10.5 3h3"/>`,camisa:`<path d="M8.5 3.5L4 6l1.8 4.5 2.2-1V20.5h8V9.5l2.2 1L20 6l-4.5-2.5a3.5 3.5 0 0 1-7 0z"/>`,salud:`<path d="M9.5 3.5h5v6h6v5h-6v6h-5v-6h-6v-5h6z"/>`,audif:`<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3.5" y="13.5" width="4" height="6.5" rx="1.5"/><rect x="16.5" y="13.5" width="4" height="6.5" rx="1.5"/>`,recibo:`<path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9 8.5h6M9 12h6"/>`,carrito:`<path d="M3 4h2.5l2.2 11h10.6l2-8H6.5"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/>`,cal:`<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>`,bolsa:`<path d="M5 8h14l-1 12.5H6z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>`,chat:`<path d="M20 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.4A8 8 0 1 1 20 12z"/>`,caja:`<path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/>`,chispa:`<path d="M12 3l1.8 5.4L19 10.2l-5.2 1.8L12 17.5l-1.8-5.5L5 10.2l5.2-1.8z"/>`};
const icono = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${SVG[k] || SVG.chispa}</svg>`;
const ICONOS = { cal: "cal", precio: "bolsa", chat: "chat", caja: "caja", web: "web" };
const MARCA = { condominio: "edificio", lucitours: "avion", genki: "palillos", matcha: "taza", koktela: "copa", spa: "hoja", candelas: "llama", aurora: "llama", alick: "frasco", chemas: "camisa", cosmo: "salud", "doctor-outlet": "salud", "service-desk": "audif", "mesa-compras": "recibo", compras: "carrito" };
const emojiDe = d => { const k = Object.keys(MARCA).sort((a, b) => b.length - a.length).find(k => d.id === k || d.id.startsWith(k + "-") || d.id.startsWith(k)); return icono(k ? MARCA[k] : ICONOS[d.ic] || "chispa"); };

const items = new Map();   // datos de cada cuadro para la portada
let n = 0;
const tile = (it, grande) => { const id = "i" + n++; const [c1, c2] = it.col || COLORES[n % COLORES.length]; it.c1 = c1; it.c2 = c2; items.set(id, it);
  return `<button class="t${grande ? " grande" : ""}" data-foco data-id="${id}" data-url="${esc(it.url)}" style="--c1:${c1};--c2:${c2}">${it.etq ? `<em>${esc(it.etq)}</em>` : ""}<span class="ic">${it.emoji}</span><b>${esc(it.nombre)}</b></button>`; };
const fila = (titulo, html) => `<section class="fila"><h2>${titulo}</h2><div class="carril">${html}</div></section>`;
const INICIO = [
  { nombre: "Mi página", url: "/", emoji: icono("web"), ceja: "Inicio", desc: "rbmsolutionscr.com: servicios, citas, galería, reseñas y demos publicadas.", chips: ["Página principal"], col: ["#2563eb", "#0b1f5c"] },
  { nombre: "Administración", url: "/#admin", emoji: icono("lock"), ceja: "Inicio", desc: "Citas, boletas del taller, ingresos, opiniones, galería, demos y visitas.", chips: ["Con contraseña"], col: ["#7c3aed", "#2e1065"] },
  { nombre: "Monitoreo", url: "/tv/monitor.html", emoji: icono("chart"), ceja: "Inicio", desc: "Cuántas personas entran a cada página y a cada demo, día por día y en vivo.", chips: ["Se actualiza cada minuto"], col: ["#059669", "#022c22"], sinVista: true },
  { nombre: "Iglesia Jesús es el Rey", url: "https://iglesiajesuseselrey.github.io/", emoji: icono("crown"), ceja: "Clientes", desc: "Página de la iglesia: cultos en vivo, eventos, peticiones de oración, fotos y panel del equipo.", chips: ["Cliente"], col: ["#4338ca", "#1e1b4b"] }];

async function cargar(){
  let demos = [], dos = [];
  try { const html = await (await fetch("/index.html", { cache: "no-store" })).text();
    const a = html.indexOf("const DEMOS = ["), b = html.indexOf("\n];", a);
    demos = Function(`"use strict";return ${html.slice(a + 14, b + 2)}`)();
    const m = html.match(/const DEMOS_2_PRINCIPAL = (\[[^\]]*\])/); if (m) dos = JSON.parse(m[1]); } catch (e) { console.warn(e); }
  const grupo = d => /-(3|pro)$/.test(d.id) ? "3" : (/-2$/.test(d.id) || dos.includes(d.id)) ? "2" : "1";
  const G = [["3", "Demos 3.0 · las más nuevas"], ["2", "Demos 2.0 · animadas"], ["1", "Demos básicas"]];
  let h = fila("Inicio", INICIO.map(it => tile(it, true)).join(""));
  for (const [k, t] of G) { const l = demos.filter(d => grupo(d) === k).sort((a, b) => a.nombre.localeCompare(b.nombre, "es")); if (!l.length) continue;
    h += fila(`${t} · ${l.length}`, l.flatMap(d => (d.links || [{ t: "", url: d.url }]).map(lk => tile({ nombre: d.nombre.replace(/ \(propuesta\)$/, ""), url: "/" + lk.url, emoji: emojiDe(d), etq: lk.t,
      ceja: t.split(" · ")[0], desc: d.desc, chips: [d.tipo, ...(lk.t ? [lk.t] : []), ...(lk.nota ? [lk.nota + " · clave demo1234"] : [])] }))).join("")); }
  $("#filasIn").innerHTML = h;
  let ult = null; try { ult = sessionStorage.getItem("tv-foco"); } catch {}
  const el = ult && document.querySelector(`.t[data-url="${CSS.escape(ult)}"]`);
  (el || document.querySelector(".t")).focus({ preventScroll: true });
}

// la portada sigue al cuadro seleccionado y muestra la página en vivo
let tVista = null, actual = null;
function portada(btn){
  const it = items.get(btn.dataset.id); if (!it || it === actual) return; actual = it;
  const info = $("#info"); info.classList.add("cambia");
  setTimeout(() => { $("#hCeja").textContent = it.ceja || "Demo"; $("#hT").textContent = it.nombre; $("#hD").textContent = it.desc || "";
    $("#hC").innerHTML = `<span class="ok">OK para abrir</span>` + (it.chips || []).filter(Boolean).map(c => `<span>${esc(c)}</span>`).join(""); info.classList.remove("cambia"); }, 180);
  document.querySelector("#aurora").style.cssText = `--c1:${it.c1};--c2:${it.c2}`;
  const v = $("#vista"); v.style.setProperty("--c1", it.c1); v.style.setProperty("--c2", it.c2);
  $("#vArte").innerHTML = it.emoji; $("#vArte").classList.remove("fuera");
  $("#vUrl").textContent = it.url.startsWith("http") ? it.url.replace(/^https?:\/\//, "").replace(/\/$/, "") : "rbmsolutionscr.com" + it.url.replace(/\/$/, "");
  $("#marco").innerHTML = ""; clearTimeout(tVista);
  if (it.sinVista) return;
  tVista = setTimeout(() => {   // espera a que se quede quieto para no cargar páginas de más
    const f = document.createElement("iframe"); f.tabIndex = -1; f.setAttribute("aria-hidden", "true"); f.loading = "eager";
    f.src = it.url.replace("#admin", "");
    const ajustar = () => { const m = $("#marco"); f.style.transform = `scale(${m.clientWidth / 1280})`; };
    f.onload = () => { ajustar(); setTimeout(() => { f.classList.add("lista"); $("#vArte").classList.add("fuera"); }, 350); };
    $("#marco").append(f); ajustar();
  }, 650);
}
// mueve las filas para que la seleccionada quede arriba, y el carril para que se vea el cuadro
function acomodar(btn){
  const filaEl = btn.closest(".fila"), filas = [...document.querySelectorAll(".fila")], i = filas.indexOf(filaEl);
  filas.forEach(f => f.classList.toggle("activa", f === filaEl));
  $("#filasIn").style.transform = `translateY(${-filaEl.offsetTop}px)`;
  const c = btn.parentElement, x = btn.offsetLeft - c.clientWidth * .5 + btn.offsetWidth * .5; c.scrollTo({ left: Math.max(0, x - c.clientWidth * .18), behavior: "smooth" });
}
// un "tic" suave al moverse, como en los televisores
let ctx = null; function tic(){ try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine"; o.frequency.value = 1400;
  g.gain.setValueAtTime(.025, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .05); o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + .06); } catch {} }
document.addEventListener("focusin", e => { const b = e.target.closest(".t"); if (!b) return; acomodar(b); portada(b); tic(); });
document.addEventListener("click", e => { const t = e.target.closest("[data-url]"); if (!t) return; try { sessionStorage.setItem("tv-foco", t.dataset.url); } catch {} location.href = t.dataset.url; });
addEventListener("resize", () => { const f = $("#marco iframe"); if (f) f.style.transform = `scale(${$("#marco").clientWidth / 1280})`; const a = document.activeElement; if (a?.classList.contains("t")) acomodar(a); });
cargar();
})();
</script>
