<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mi tarjeta · Matcha Mía</title>
<meta name="theme-color" content="#d6246e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matcha Mía">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* La tarjeta del cliente: se ve como una tarjeta física de sellos, con el QR arriba y los sellos abajo. Se actualiza sola. */
:root{
  --fondo:#d6246e; --tarjeta:#fff6fa; --rosa:#fbe3ee; --rosa2:#f6c4d9; --fucsia:#d6246e; --fucsia2:#b0185a; --matcha:#7aa33b;
  --tinta:#3a1424; --suave:#8a5a6e; --linea:#f0cfdd;
  --f-logo:"Shrikhand","Arial Rounded MT Bold",system-ui,sans-serif; --f-txt:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(circle at 20% 0%,#f05a95,var(--fondo) 55%,#a5124f);color:var(--tinta);font:400 16px/1.5 var(--f-txt);-webkit-font-smoothing:antialiased;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.t{max-width:420px;margin:0 auto;background:var(--tarjeta);border-radius:28px;padding:22px 20px 20px;box-shadow:0 30px 60px -24px rgba(58,20,36,.6);display:grid;gap:16px;text-align:center}
.marca{font:400 30px/1 var(--f-logo);color:var(--fucsia)}
.sub{color:var(--suave);font-weight:700;font-size:14px;margin-top:-8px}
.nombre{font-size:20px;font-weight:800}
.qr{width:220px;height:220px;margin:0 auto;background:#fff;border-radius:18px;padding:10px;border:2px solid var(--linea)}
.qr img,.qr canvas{width:100%!important;height:auto!important}
.sellos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sellos i{aspect-ratio:1;border-radius:50%;border:2px solid var(--rosa2);display:grid;place-items:center;font-style:normal;font-size:20px;background:#fff;transition:transform .3s}
.sellos i.si{background:var(--fucsia);border-color:var(--fucsia);color:#fff}
.sellos i.gratis{border-style:dashed;font-size:10.5px;font-weight:800;color:var(--fucsia2)}
.sellos i.nuevo{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.estado{font-size:17px}
.estado b{color:var(--fucsia2)}
.vivo{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--suave);font-weight:700;justify-self:center}
.vivo i{width:8px;height:8px;border-radius:50%;background:var(--matcha);box-shadow:0 0 0 4px rgba(122,163,59,.2)}
.guardar{background:#fff;border:2px dashed var(--rosa2);border-radius:18px;padding:12px 14px;text-align:left;font-size:14px;display:grid;gap:6px}
.guardar b{font-size:15px}
.guardar ol{margin:0;padding-left:20px;display:grid;gap:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--fucsia);background:#fff;color:var(--fucsia2);font:800 15px var(--f-txt);border-radius:14px;padding:11px 16px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--fucsia);color:#fff}
.links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.nota{font-size:13px;color:var(--suave)}
.dueña{font-size:12.5px;color:var(--suave)}
.dueña a{color:var(--suave)}
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--tinta);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="t" id="t">
  <div class="marca">Matcha Mía</div>
  <div class="sub">Tarjeta de sellos</div>
  <p class="nota" id="carga">Cargando tu tarjeta…</p>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="qrcode.min.js"></script>
<script src="tarjetas.js"></script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const esIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const instalada = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let tAviso; const aviso = t => { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tAviso); tAviso = setTimeout(() => el.classList.remove("on"), 3000); };

// El código de la tarjeta viene en el link (#t=...). Se recuerda en este celular para abrirla aunque falte el link.
addEventListener("hashchange", () => { const n = Tarjetas.tokenDeTexto(location.hash); if (n && n !== token) location.reload(); });
const token = Tarjetas.tokenDeTexto(location.hash) || lsGet("mm-token", null);
const t = $("#t");
if (!token) {
  t.innerHTML = `<div class="marca">Matcha Mía</div><div class="sub">Tarjeta de sellos</div>
    <p>No encontramos tu tarjeta en este celular.</p><p class="nota">Abrí el link que te mandamos por WhatsApp, o pedí tu tarjeta en la barra.</p>
    <a class="btn" href="./">Ver el menú</a>`;
  return;
}
lsSet("mm-token", token);
if (!location.hash.includes(token)) history.replaceState(null, "", "#t=" + token);

let antes = null;
function pintar(c) {
  if (!c) {
    t.innerHTML = `<div class="marca">Matcha Mía</div><div class="sub">Tarjeta de sellos</div><p>Esta tarjeta ya no existe.</p><p class="nota">Pedí una nueva en la barra.</p>`;
    lsSet("mm-token", null); return;
  }
  const s = Math.min(c.sellos || 0, 10), sube = antes != null && s > antes;
  const sellos = Array.from({length: 10}, (_, i) => {
    const cls = (i < s ? "si" : i === 9 ? "gratis" : "") + (sube && i >= antes && i < s ? " nuevo" : "");
    return `<i class="${cls}">${i < s ? (i === 9 ? "★" : "🐾") : i === 9 ? "GRATIS" : ""}</i>`;
  }).join("");
  const pasos = esIOS ? `<li>Tocá <b>Compartir</b> (el cuadro con la flecha).</li><li>Tocá <b>Agregar a inicio</b>.</li>` : `<li>Tocá el menú <b>⋮</b> del navegador.</li><li>Tocá <b>Agregar a pantalla principal</b>.</li>`;
  t.innerHTML = `<div class="marca">Matcha Mía</div><div class="sub">Tarjeta de sellos</div>
    <div class="nombre">${esc(c.nombre)}</div>
    <div class="qr" id="qr" aria-label="Tu código QR"></div>
    <p class="nota">Mostrá este QR en la barra para sumar sellos.</p>
    <div class="sellos" aria-label="${s} de 10 sellos">${sellos}</div>
    <p class="estado">${s >= 10 ? "<b>¡Tu próxima bebida es gratis!</b><br>Mostrá tu QR para canjearla." : `Llevás <b>${s} de 10</b>. Te falta${10 - s === 1 ? "" : "n"} ${10 - s} para tu bebida gratis.`}</p>
    ${c.canjes ? `<p class="nota">Ya canjeaste ${c.canjes} bebida${c.canjes === 1 ? "" : "s"} gratis 💚</p>` : ""}
    <span class="vivo"><i></i>Se actualiza sola</span>
    ${instalada() ? "" : `<div class="guardar"><b>Guardala en tu celular</b><span>Así la abrís como una app, sin buscar el link:</span><ol>${pasos}</ol></div>`}
    <div class="links"><a class="btn" href="./">Ver el menú y pedir</a></div>
    <p class="dueña">¿Sos del personal? <a href="./#sellos-${token}">Sumar sellos</a></p>`;
  try { new QRCode($("#qr"), {text: Tarjetas.link(token), width: 240, height: 240, colorDark: "#3a1424", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M}); }
  catch { $("#qr").innerHTML = `<p class="nota">No se pudo dibujar el QR.</p>`; }
  if (sube) { aviso(s >= 10 ? "¡Completaste tu tarjeta! 🎉" : `¡Sumaste ${s - antes} sello${s - antes === 1 ? "" : "s"}! 💚`); if (navigator.vibrate) navigator.vibrate([60, 40, 60]); }
  else if (antes === 10 && s === 0) aviso("¡Disfrutá tu bebida gratis! Tu tarjeta empieza de nuevo.");
  antes = s;
}
Tarjetas.escuchar(token, pintar, () => { $("#carga") && ($("#carga").textContent = "No se pudo cargar tu tarjeta. Revisá tu conexión."); })
  .catch(() => { t.innerHTML = `<div class="marca">Matcha Mía</div><div class="sub">Tarjeta de sellos</div><p>No se pudo cargar tu tarjeta.</p><p class="nota">Revisá tu conexión e intentá de nuevo.</p>`; });
})();
</script>
</body>
</html>
