/* ===================== Centro Mundial de Adoración: YouTube, ministerios y detalles ===================== */
let YT = [], YTCANAL = "";
async function cargarYT(){ try { const [l, c] = await Promise.all([getDocs(collection(fb, "yt")), getDoc(doc(fb, "sitio", "youtube"))]);
  YT = l.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "")); YTCANAL = c.exists() ? (c.data().canal || "") : ""; } catch (e) { console.warn(e); } }
const SERIES = ["Prédicas", "Edificando la Casa de Dios", "Alabanza y adoración", "Juventud", "Testimonios", "Otro"];
function verYT(u, titulo){
  const id = ytId(u); if (!id) { window.open(u, "_blank", "noopener"); return; }
  const v = document.createElement("div"); v.className = "yt-ver"; v.setAttribute("role", "dialog"); v.setAttribute("aria-label", titulo || "Video");
  v.innerHTML = `<div><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0" title="${esc(titulo || "Video")}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
    <div class="yt-acc"><button class="btn" type="button" data-cerrar>Cerrar ✕</button><a class="btn yt" href="https://www.youtube.com/watch?v=${encodeURIComponent(id)}" target="_blank" rel="noopener">Ver en YouTube</a></div></div>`;
  document.body.append(v); document.body.classList.add("locked");
  const cerrar = () => { v.remove(); document.body.classList.remove("locked"); removeEventListener("keydown", tecla); }, tecla = e => { if (e.key === "Escape") cerrar(); };
  v.addEventListener("click", e => { if (e.target === v || e.target.closest("[data-cerrar]")) cerrar(); }); addEventListener("keydown", tecla);
}
const ytCard = y => { const id = ytId(y.url); return `<button class="yt-card" type="button" data-yt="${esc(y.id)}"><span class="mini">${id ? `<img src="https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg" alt="" loading="lazy">` : ""}</span><span class="tx">${y.serie ? `<small>${esc(y.serie)}</small>` : ""}<b>${esc(y.titulo || "Video")}</b>${y.fecha ? `<small>${esc(fechaLarga(y.fecha))}</small>` : ""}</span></button>`; };
function mejorarCMA(){
  if (view !== "public") return;
  if (!$(".demo-cma")) document.body.insertAdjacentHTML("afterbegin", `<div class="demo-cma">⛪ <b>Página de demostración</b> hecha por RBM Solutions CR para el Centro Mundial de Adoración · horarios y algunos datos son de ejemplo</div>`);
  const env = $("#envivo");
  if (env && !$("#videos-cma")) {
    env.insertAdjacentHTML("afterend", `<section id="videos-cma"><div class="head"><div><span class="ceja3">Canal de YouTube</span><h2>Prédicas y videos</h2><p class="sub">Mensajes, alabanza y la serie “Edificando la Casa de Dios”. Toca un video para verlo aquí mismo.</p></div></div>
      <div class="yt-grid" id="ytLista"></div><div class="yt-acc" id="ytAcc"></div></section>
      <section id="ministerios-cma"><div class="min-grid"><img src="f/edificando.jpg" alt="Afiche de la serie radial Edificando la Casa de Dios" loading="lazy">
        <div><span class="ceja3">Serie de programas radiales</span><h2>Edificando la Casa de Dios</h2><p class="sub">El Centro Mundial de Adoración presenta su serie de programas para edificar la iglesia en cada área de servicio.</p>
          <ul class="mins"><li>Intercesión</li><li>Evangelismo</li><li>Adoración</li><li>Pastoral</li><li>Juventud</li></ul>
          <div class="yt-acc" style="margin-top:18px"><a class="btn" href="https://wa.me/${esc(D.cfg.whatsapp || DEFAULT.whatsapp)}?text=${encodeURIComponent("Hola 👋, quiero información sobre los ministerios del Centro Mundial de Adoración.")}" target="_blank" rel="noopener">💬 Quiero servir en un ministerio</a></div></div></div></section>`);
    pintarYT();
  }
  const ub = $("#ubicacion .sub"); if (ub && !$(".dir-cma")) ub.insertAdjacentHTML("afterend", `<p class="dir-cma">📍 100 m sur y 50 m este del Parque de Tibás, San José</p>`);
  const nav = $(".nav .wrap"); if (nav && !nav.querySelector('[href="#videos-cma"]')) nav.querySelector('a[href="#eventos"]')?.insertAdjacentHTML("beforebegin", `<a href="#videos-cma">Videos</a>`);
}
function pintarYT(){
  const l = $("#ytLista"); if (!l) return;
  l.innerHTML = YT.length ? YT.slice(0, 9).map(ytCard).join("") : `<div class="empty">Pronto subiremos aquí nuestras prédicas.</div>`;
  $("#ytAcc").innerHTML = (YTCANAL ? `<a class="btn yt" href="${esc(YTCANAL)}" target="_blank" rel="noopener">▶ Ver el canal de YouTube</a>` : "") + (YTCANAL ? `<a class="btn" href="${esc(YTCANAL)}${YTCANAL.includes("?") ? "&" : "?"}sub_confirmation=1" target="_blank" rel="noopener">🔔 Suscribirme</a>` : "");
}
document.addEventListener("click", e => { const b = e.target.closest("[data-yt]"); if (!b) return; const y = YT.find(x => x.id === b.dataset.yt); if (y) verYT(y.url, y.titulo); });
const _renderPublicCMA = renderPublic;

/* --- Pestaña YouTube en la administración --- */
async function tabYouTube(t){
  await cargarYT();
  t.innerHTML = `<section><div class="head"><div><h2>YouTube</h2><p class="sub">Pegue el enlace del canal y agregue los videos que quiere mostrar en la página (prédicas, alabanza, programas).</p></div></div>
    <div class="field"><label class="label" for="yt-canal">Enlace del canal de YouTube</label><div class="vadd" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px"><input type="url" id="yt-canal" style="min-width:0" placeholder="https://www.youtube.com/@su-canal" value="${esc(YTCANAL)}"><button type="button" class="btn ghost" id="yt-gc">Guardar</button></div></div>
    <div class="medidor" style="display:grid;gap:10px"><b>Agregar un video</b>
      <div class="field"><label class="label" for="yt-u">Enlace del video</label><input type="url" id="yt-u" placeholder="https://youtu.be/…  o  https://www.youtube.com/watch?v=…"></div>
      <div class="field"><label class="label" for="yt-t">Título</label><input type="text" id="yt-t" maxlength="90" placeholder="Ej.: Prédica · La Gran Comisión"></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px"><div class="field" style="min-width:0"><label class="label" for="yt-s">Serie</label><select id="yt-s">${SERIES.map(x => `<option>${x}</option>`).join("")}</select></div>
        <div class="field"><label class="label" for="yt-f">Fecha</label><input type="date" id="yt-f" value="${hoyISO()}"></div></div>
      <div id="yt-prev"></div><p class="err" id="yt-e" hidden></p><button class="btn" type="button" id="yt-add">+ Agregar video</button></div>
    <h3 style="margin:22px 0 10px">Videos en la página (${YT.length})</h3>
    <div style="display:grid;gap:10px">${YT.length ? YT.map(y => { const id = ytId(y.url); return `<div class="medidor" style="display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center">
      ${id ? `<img src="https://i.ytimg.com/vi/${encodeURIComponent(id)}/mqdefault.jpg" alt="" style="width:96px;border-radius:10px">` : "<span></span>"}<div><b>${esc(y.titulo)}</b><div class="sub" style="font-size:13px">${esc(y.serie || "")}${y.fecha ? " · " + esc(fechaLarga(y.fecha)) : ""}</div></div>
      <button class="btn small ghost" type="button" data-ytdel="${esc(y.id)}">Quitar</button></div>`; }).join("") : `<div class="empty">Todavía no hay videos.</div>`}</div></section>`;
  const err = m => { const p = $("#yt-e", t); p.textContent = m; p.hidden = !m; };
  $("#yt-u", t).addEventListener("input", () => { const id = ytId($("#yt-u", t).value.trim()); $("#yt-prev", t).innerHTML = id ? `<img src="https://i.ytimg.com/vi/${encodeURIComponent(id)}/mqdefault.jpg" alt="Vista previa" style="width:200px;border-radius:12px">` : ""; });
  $("#yt-gc", t).onclick = async () => { const u = $("#yt-canal", t).value.trim(); if (u && !/^https:\/\/(www\.|m\.)?youtube\.com\//i.test(u)) { toast("Pegue un enlace de youtube.com"); return; }
    await setDoc(doc(fb, "sitio", "youtube"), { canal: u }); YTCANAL = u; toast("Canal guardado"); };
  $("#yt-add", t).onclick = async () => { const u = $("#yt-u", t).value.trim(), ti = $("#yt-t", t).value.trim();
    if (!ytId(u)) return err("Pegue un enlace válido de un video de YouTube."); if (ti.length < 3) return err("Escriba el título del video.");
    await addDoc(collection(fb, "yt"), { url: u, titulo: ti, serie: $("#yt-s", t).value, fecha: $("#yt-f", t).value || hoyISO() }); toast("Video agregado"); tabYouTube(t); };
  t.querySelectorAll("[data-ytdel]").forEach(b => b.onclick = async () => { if (!confirm("¿Quitar este video de la página?")) return; await deleteDoc(doc(fb, "yt", b.dataset.ytdel)); toast("Video quitado"); tabYouTube(t); });
}

onAuthStateChanged(auth, user => {
  const irAlPanel = !authInicial; authInicial = false;
  const email = (user?.email || "").toLowerCase();
  rol = Object.values(USUARIOS).find(u => u.email === email)?.rol || null;
  if (unsubReqs) { unsubReqs(); unsubReqs = null; }
  if (user && !rol) { signOut(auth); return; }
  if (rol) { try { localStorage.setItem("equipo", "1"); } catch {} }
  if (BUZON[rol]) {
    const B = BUZON[rol];
    view = rol; reqs = []; rdest = "general"; pastorVista = "pet"; avisoCerrado = false; primeraCarga = true;
    vistoAntes = leerVisto();
    if (irAlPanel) renderPastor(); else view = "public";
    const q = B.filtro ? query(collection(fb,"peticiones"), where("destino","==",B.filtro)) : collection(fb,"peticiones");
    unsubReqs = onSnapshot(q,
      snap => {
        if (!primeraCarga) snap.docChanges().filter(c => c.type === "added").forEach(c => avisar({id:c.doc.id, ...c.doc.data()}));
        reqs = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => msDe(b) - msDe(a));
        if (primeraCarga && !vistoAntes) { vistoAntes = Date.now(); guardarVisto(vistoAntes); avisoCerrado = true; }

        actualizarInsignia();

    if (irAlPanel) { view = "musicos"; renderMusicos(); }
  } else if (rol === "admin") {
    if (irAlPanel) { view = "admin"; renderAdmin(); }
    apagarDirectoVencido();
  } else if (view !== "public") {
    view = "public"; renderPublic();
  }
});
