<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0e10">
<title>Mi pedido · Cosmo Scrubs Medical</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Fredoka:wght@600;700&display=swap">
<style>
:root{--negro:#0d0e10;--negro2:#17191c;--negro3:#24272b;--lima:#cdf54f;--lima-osc:#4f6b00;--fondo:#f4f5f1;--linea:#e2e4dc;--tinta:#141517;--suave:#5b5f66;--wa:#25d366;--rojo:#b42318;
  --f-t:"Poppins",system-ui,sans-serif;--f-x:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--f-m:"Fredoka","Poppins",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font:400 16px/1.55 var(--f-x);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-t);margin:0;line-height:1.15}
.i{width:1.15em;height:1.15em;flex:none;display:inline-block;vertical-align:-.2em}
.top{background:var(--negro);color:#fff}
.top .wrap{display:flex;align-items:center;gap:10px;height:64px}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.marca img{width:40px;height:40px;border-radius:50%}
.marca b{display:block;font:700 20px/1 var(--f-m)}
.marca small{display:block;font:600 10px var(--f-t);letter-spacing:.16em;text-transform:uppercase;color:var(--lima);margin-top:3px}
.top a.vol{margin-left:auto;color:#c3c7cd;font-size:14px;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
main{padding:24px 0 60px}
.caja{background:#fff;border:1px solid var(--linea);border-radius:22px;padding:22px;margin-top:16px}
.cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.cab small{display:block;color:var(--suave);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.cab h1{font-size:34px;font-weight:800}
.est{display:inline-block;border-radius:999px;padding:6px 14px;font:600 13px var(--f-t)}
.e-nuevo{background:#fff4d6;color:#7a5200}.e-confirmado{background:#eef8cf;color:#2f4000}.e-pagado{background:#dff2ff;color:#0b4f7a}.e-enviado{background:var(--negro);color:var(--lima)}.e-cancelado{background:#fde3e3;color:var(--rojo)}
.linea{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:20px}
.linea div{text-align:center;font-size:12.5px;color:var(--suave);font-weight:600}
.linea div::before{content:"";display:block;height:6px;border-radius:999px;background:var(--linea);margin-bottom:8px}
.linea div.si{color:var(--tinta)}.linea div.si::before{background:var(--lima-osc)}
.msg{margin-top:18px;background:var(--fondo);border-radius:16px;padding:14px 16px;font-size:15px}
.msg b{font-family:var(--f-t)}
.it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--linea)}
.it:last-child{border-bottom:0}
.it img{width:52px;height:66px;object-fit:cover;border-radius:10px;background:#eceee8;flex:none}
.it .t{flex:1;min-width:0}
.it b{display:block;font:600 15px var(--f-t)}
.it small{color:var(--suave);font-size:13px}
.it .p{text-align:right;font-weight:600;font-size:15px}
.it .tag{display:inline-block;margin-top:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.it .ok{background:#eef8cf;color:#2f4000}.it .no{background:#fde3e3;color:var(--rojo)}
.it.agotado b,.it.agotado .p{text-decoration:line-through;color:var(--suave)}
.res{margin-top:12px;display:grid;gap:6px;font-size:15px}
.res div{display:flex;justify-content:space-between}
.res .ah{color:var(--lima-osc);font-weight:600}
.res .tot{font:700 21px var(--f-t);border-top:1px solid var(--linea);padding-top:10px;margin-top:4px}
h2{font-size:20px;display:flex;gap:10px;align-items:center}
h2 .i{color:var(--lima-osc)}
.pago{display:grid;gap:10px;margin-top:14px}
.pago div{background:var(--fondo);border-radius:14px;padding:12px 14px}
.pago small{display:block;color:var(--suave);font-size:13px}
.pago b{font:600 17px var(--f-t);word-break:break-all}
.pago button{border:0;background:none;color:var(--lima-osc);font-weight:600;font-size:13px;padding:0;margin-left:8px}
.comp-sub{display:flex;gap:12px;align-items:center;border:1.5px dashed #b9bdb1;border-radius:14px;padding:14px;cursor:pointer;background:#fafbf8;margin-top:14px}
.comp-sub .i{width:26px;height:26px;color:var(--lima-osc)}
.comp-sub b,.comp-sel b{display:block;font:600 14px var(--f-t)}
.comp-sub small,.comp-sel small{display:block;color:var(--suave);font-size:13px}
.comp-sel{display:flex;gap:12px;align-items:center;border:1.5px solid var(--linea);border-radius:14px;padding:10px;margin-top:14px}
.comp-sel img{width:56px;height:72px;object-fit:cover;border-radius:10px}
.comp-sel span{flex:1;min-width:0}
.comp-sel button{border:0;background:none;color:var(--rojo);font-size:13px}
.b{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 22px;font:600 15px var(--f-t);text-decoration:none;border:1.5px solid transparent;width:100%;margin-top:12px}
.b-wa{background:var(--wa);color:#062b14}.b-negro{background:var(--negro);color:#fff}.b-claro{background:#fff;border-color:var(--linea)}
.b:disabled{opacity:.5}
.nota{font-size:13px;color:var(--suave);margin-top:10px;text-align:center}
.hist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px;font-size:14px}
.hist li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--linea);padding-bottom:8px}
.hist small{color:var(--suave);white-space:nowrap}
.vacio{text-align:center;color:var(--suave);padding:40px 10px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--negro);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;z-index:90;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="marca" href="./"><img src="logo.png" alt="" width="40" height="40"><span><b>Cosmo</b><small>Scrubs Medical</small></span></a><a class="vol" href="./">Volver a la tienda</a></div></header>
<main class="wrap" id="app"><p class="vacio">Cargando su pedido…</p></main>
<script src="datos.js"></script>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const crc = n => "₡" + String(Math.round(+n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const fecha = t => t ? new Date(t).toLocaleString("es-CR", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "";
const ICO = p => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I_CARD = ICO('<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>'), I_BOX = ICO('<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/>'),
  I_SUB = ICO('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>'), I_TRUCK = ICO('<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>');
function toast(t){ const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2800); }
const ESTADOS = { nuevo: "En validación", confirmado: "Confirmado · pendiente de pago", pagado: "Pago recibido", enviado: "Enviado", cancelado: "Cancelado" };
const PASO = { nuevo: 1, confirmado: 2, pagado: 3, enviado: 4, cancelado: 0 };
const id = new URLSearchParams(location.search).get("id") || "";
let aj = null, comp = null, compURL = "", ped = null;
const waAsesora = m => { const n = String(aj?.whatsapp || "").replace(/\D/g, ""); return `https://wa.me/${n ? (n.length === 8 ? "506" + n : n) : ""}?text=${encodeURIComponent(m)}`; };

function pintar(){
  const app = $("#app");
  if (!ped) { app.innerHTML = `<div class="caja vacio"><h2 style="justify-content:center">No encontramos este pedido</h2><p style="margin-top:8px">Revise el link o escríbanos por WhatsApp con su número de orden.</p></div>`; return; }
  const p = ped, t = Pedidos.totales(p.items), revisado = p.estado !== "nuevo", paso = PASO[p.estado] || 0;
  const noDisp = p.items.filter(x => x.disp === false);
  let msg = "";
  if (p.estado === "nuevo") msg = `<b>Estamos revisando su pedido.</b> Confirmamos que todo esté disponible y le avisamos por WhatsApp. Todavía no tiene que pagar.`;
  if (p.estado === "confirmado") msg = `<b>¡Su pedido está confirmado!</b> ${noDisp.length ? `Hay ${noDisp.length === 1 ? "un artículo" : noDisp.length + " artículos"} que no tenemos en este momento y no se cobra${noDisp.length === 1 ? "" : "n"}. ` : "Todo está disponible. "}Ya puede pagar y subir el comprobante aquí abajo.`;
  if (p.estado === "pagado") msg = `<b>Recibimos su pago.</b> Estamos preparando su pedido para enviarlo.`;
  if (p.estado === "enviado") msg = `<b>Su pedido va en camino.</b> ${p.guia ? `Número de guía de Correos de Costa Rica: <b>${esc(p.guia)}</b>.` : ""}`;
  if (p.estado === "cancelado") msg = `<b>Este pedido fue cancelado.</b> Si tiene dudas, escríbanos por WhatsApp.`;
  app.innerHTML = `<div class="caja">
      <div class="cab"><div><small>Número de orden</small><h1>${esc(p.codigo)}</h1></div><span class="est e-${p.estado}">${ESTADOS[p.estado] || p.estado}</span></div>
      ${p.estado !== "cancelado" ? `<div class="linea">${["Recibido", "Validado", "Pagado", "Enviado"].map((n, i) => `<div class="${i < paso ? "si" : ""}">${n}</div>`).join("")}</div>` : ""}
      <div class="msg">${msg}${p.nota ? `<br><br><b>Nota de la asesora:</b> ${esc(p.nota)}` : ""}</div></div>
    <div class="caja"><h2>${I_BOX}Su pedido</h2>
      ${p.items.map(x => `<div class="it${x.disp === false ? " agotado" : ""}"><img src="${esc(x.foto)}" alt=""><span class="t"><b>${x.cant} × ${esc(x.nombre)}</b><small>${esc(x.color)}${x.talla ? " · Talla " + esc(x.talla) : ""}${x.largo ? " · Largo " + esc(x.largo.toLowerCase()) : ""}</small>
        ${revisado && x.disp !== null ? `<br><span class="tag ${x.disp ? "ok" : "no"}">${x.disp ? "Disponible" : "No disponible"}</span>` : ""}</span><span class="p">${crc(x.precio * x.cant)}</span></div>`).join("")}
      <div class="res"><div><span>Subtotal</span><span>${crc(t.sub)}</span></div>${t.ahorro ? `<div class="ah"><span>Promo Cosmo</span><span>−${crc(t.ahorro)}</span></div>` : ""}
        <div><span>${p.cliente.entrega.startsWith("Envío") ? "Envío por Correos a " + esc(p.cliente.lugar) : "Retiro en la fábrica"}</span><span>Gratis</span></div>
        <div class="tot"><span>${revisado ? "Total a pagar" : "Total estimado"}</span><span>${crc(t.total)}</span></div></div></div>
    ${p.estado === "confirmado" ? pagoHTML(p, t) : ""}
    <div class="caja"><h2>Historial</h2><ul class="hist">${(p.historial || []).slice().reverse().map(h => `<li><span>${esc(h.txt)}</span><small>${fecha(h.t)}</small></li>`).join("")}</ul></div>`;
  if (p.estado === "confirmado") conectarPago(p, t);
}
function pagoHTML(p, t){
  const sinpe = aj.sinpe, cuenta = aj.cuenta;
  return `<div class="caja"><h2>${I_CARD}Pague ${crc(t.total)}</h2>
    <div class="pago">
      ${p.pago === "SINPE Móvil" || !cuenta ? `<div><small>SINPE Móvil</small><b>${sinpe ? esc(sinpe) : "Número pendiente"}</b>${sinpe ? `<button type="button" data-copiar="${esc(sinpe)}">Copiar</button>` : ""}${aj.titular ? `<small>A nombre de ${esc(aj.titular)}</small>` : ""}</div>` : ""}
      ${p.pago !== "SINPE Móvil" || !sinpe ? `<div><small>Transferencia · ${esc(aj.banco || "Banco")}</small><b>${cuenta ? esc(cuenta) : "Cuenta pendiente"}</b>${cuenta ? `<button type="button" data-copiar="${esc(cuenta)}">Copiar</button>` : ""}${aj.titular ? `<small>A nombre de ${esc(aj.titular)}</small>` : ""}</div>` : ""}
      ${!sinpe && !cuenta ? `<div><small>Página de ejemplo</small>La asesora pone sus datos de pago desde su panel y aparecen aquí.</div>` : ""}
    </div>
    <p style="font-size:14px;color:var(--suave);margin-top:12px">En el detalle del pago ponga su número de orden: <b>${esc(p.codigo)}</b></p>
    <div id="comp"></div>
    <button type="button" class="b b-wa" id="enviar-comp" disabled>Enviar comprobante por WhatsApp</button>
    ${p.pagoAvisado ? `<p class="nota"><b>Ya nos avisó que pagó.</b> Lo verificamos y le confirmamos.</p>` : `<p class="nota">En el celular se abre la opción de compartir: escoja WhatsApp y el chat de Cosmo, y le llega la imagen con su número de orden.</p>`}
  </div>`;
}
function conectarPago(p, t){
  document.querySelectorAll("[data-copiar]").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copiar); toast("Copiado"); } catch { toast(b.dataset.copiar); } });
  const caja = $("#comp"), btn = $("#enviar-comp");
  const pintarComp = () => {
    caja.innerHTML = comp ? `<div class="comp-sel"><img src="${compURL}" alt="Comprobante"><span><b>${esc(comp.name || "Comprobante")}</b><small>Listo para enviar</small></span><button type="button" id="cq">Quitar</button></div>`
      : `<label class="comp-sub"><input type="file" id="cf" accept="image/*" hidden>${I_SUB}<span><b>Subir pantallazo del SINPE o la transferencia</b><small>Foto o captura de pantalla del comprobante</small></span></label>`;
    btn.disabled = !comp;
    $("#cf")?.addEventListener("change", e => { const f = e.target.files[0]; if (!f || !f.type.startsWith("image/")) return; comp = f; if (compURL) URL.revokeObjectURL(compURL); compURL = URL.createObjectURL(f); pintarComp(); });
    $("#cq")?.addEventListener("click", () => { comp = null; URL.revokeObjectURL(compURL); compURL = ""; pintarComp(); });
  };
  pintarComp();
  btn.onclick = async () => {
    const texto = `Hola, le envío el comprobante de pago del pedido *${p.codigo}* por ${crc(t.total)} (${p.pago}).\nA nombre de: ${p.cliente.nombre}`;
    let archivo = comp; try { archivo = new File([comp], comp.name || "comprobante.jpg", { type: comp.type || "image/jpeg" }); } catch {}
    try { if (!p.pagoAvisado) await Pedidos.cambiar(p.id, { pagoAvisado: true }, "El cliente envió el comprobante de pago"); } catch {}
    if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
      try { await navigator.clipboard?.writeText(texto); } catch {}
      try { await navigator.share({ files: [archivo], text: texto, title: "Comprobante " + p.codigo }); } catch (x) { if (x && x.name !== "AbortError") window.open(waAsesora(texto), "_blank"); }
    } else { window.open(waAsesora(texto), "_blank"); toast("Adjunte el comprobante en el chat de WhatsApp."); }
  };
}
(async () => {
  try { aj = await Pedidos.ajustes(); } catch { aj = { whatsapp: "6131-9025" }; }
  if (!id) { ped = null; pintar(); return; }
  Pedidos.escucharUno(id, p => { const antes = ped?.estado; ped = p; if (p) document.title = p.codigo + " · Cosmo Scrubs Medical"; if (antes && p && antes !== p.estado) toast("Su pedido ahora está: " + ESTADOS[p.estado]); pintar(); },
    () => { $("#app").innerHTML = `<p class="vacio">No se pudo cargar el pedido. Revise su conexión.</p>`; }).catch(() => {});
})();
</script>
</body>
</html>
